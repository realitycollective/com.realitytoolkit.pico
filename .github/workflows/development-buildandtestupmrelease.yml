name: Build and test UPM packages for platforms, all branches except main

on:
  pull_request:
    branches-ignore:    
      - 'main'
  # Ignore PRs targeting main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check Unity version required by the package
  validate-environment:
    name: Get Unity Version from UPM package
    uses: realitycollective/reusableworkflows-reality-toolkit/.github/workflows/getunityversionfrompackage.yml@1.0.4
    with:
      runs-on: '["self-hosted", "windows", "unity"]'

  # Check Unity Hub and Editor Environment
  Validate-Unity:
    name: Validate Unity Install
    needs: validate-environment
    uses: realitycollective/reusableworkflows-reality-toolkit/.github/workflows/validateunityinstall.yml@1.0.4
    with:
      runs-on: '["self-hosted", "windows", "unity"]'
      unityversion: ${{ needs.validate-environment.outputs.unityversion }}

  # Run Unity unit tests defined in the package
  Run-Unit-Tests:
    name: Run Unity Unit Tests
    needs: Validate-Unity
    uses: realitycollective/reusableworkflows-reality-toolkit/.github/workflows/rununityUPMbuild.yml@1.0.4
    with:
      runs-on: '["self-hosted", "windows", "unity"]'
      unityversion: ${{ needs.Validate-Unity.outputs.unityeditorversion }}
      dependencies: '[{"development": "github.com/realitycollective/com.realitytoolkit.core.git"},{"development": "github.com/realitycollective/com.realitytoolkit.player.git"},{"development": "github.com/realitycollective/com.realitycollective.utilities.git"},{"development": "github.com/realitycollective/com.realitytoolkit.service-framework.git"},{"main": "github.com/Pico-Developer/PICO-Unity-Integration-SDK.git"}]'
    secrets: inherit

  Build-Complete:
    runs-on: ubuntu-latest
    name: Build completion task
    needs: Run-Unit-Tests
    steps: 
      - run: echo "Build Complete"